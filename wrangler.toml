name = "discord-bot-worker"
main = "worker-bot.js"
compatibility_date = "2024-01-31"
node_compat = true

# Cloudflare Workers Configuration
# NOTE: This worker version has LIMITED functionality
# It can only handle slash commands via Interactions Endpoint
# It CANNOT handle real-time voice events (join/leave/online alerts)

[vars]
# Get this from Discord Developer Portal > General Information > Public Key
# DISCORD_PUBLIC_KEY = "your_public_key_here"

# For production, use secrets instead:
# Run: wrangler secret put DISCORD_PUBLIC_KEY
# Run: wrangler secret put DISCORD_TOKEN

# Optional: Use Cloudflare D1 instead of MongoDB
# [[d1_databases]]
# binding = "DB"
# database_name = "discord-bot-db"
# database_id = "your-database-id"

# Optional: Use Cloudflare KV for caching
# [[kv_namespaces]]
# binding = "CACHE"
# id = "your-kv-namespace-id"

[env.production]
name = "discord-bot-worker"
workers_dev = false
route = "discord-bot.your-domain.com/*"

[env.staging]
name = "discord-bot-worker-staging"
workers_dev = true

# Limits
[limits]
# Workers can run for max 30 seconds
# This is why persistent WebSocket connections are not possible
cpu_ms = 10000

# Build configuration
[build]
command = ""

[build.upload]
format = "service-worker"
